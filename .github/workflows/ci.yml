name: CI
on:
  push:
    branches: [main, codex/casemap-v11, codex/casemap-v2]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: npm run test:browser
      - run: npm run test:video
      - run: npm run test:parity
      - run: npm run test:private
      - run: npm run test:film-browser
      - run: node tests/film-private.mjs
      - run: npm run render:geo -- --smoke --output out/geo-smoke.mp4
      - run: npm run render:film -- --smoke --output out/film-smoke.mp4
