name: Deploy CaseMap Studio Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for the Pages artifact index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' | grep -q '^[0-9]'; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::The Pages artifact did not appear in the Actions index"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
