name: Hubbard documentary animations
on:
  push:
    branches: [production/hubbard-animations]
    paths:
      - 'productions/copa-2025-0001636/**'
      - '.github/workflows/hubbard-render.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    strategy:
      fail-fast: false
      matrix:
        mode: [geo, reconstruction]
    env:
      CASEMAP_NATIVE_2D: ${{ matrix.mode == 'reconstruction' && '1' || '0' }}
    defaults:
      run:
        working-directory: productions/copa-2025-0001636
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install 'Pillow==12.0.0' 'numpy==2.3.5'
          npm ci
          if [ "${{ matrix.mode }}" = "geo" ]; then npx playwright install --with-deps chromium --only-shell; fi
      - run: python scripts/prepare_assets.py
      - run: npm run render -- ${{ matrix.mode }} --preview
      - run: npm run render -- ${{ matrix.mode }}
      - run: bash scripts/qa.sh ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        with:
          name: hubbard-${{ matrix.mode }}
          path: |
            productions/copa-2025-0001636/renders/*.mp4
            productions/copa-2025-0001636/renders/*.jpg
            productions/copa-2025-0001636/qa/*-ffprobe.json
            productions/copa-2025-0001636/qa/*-blackdetect.log
          if-no-files-found: error
          compression-level: 0
